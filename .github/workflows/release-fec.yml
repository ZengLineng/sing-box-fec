name: FECBox Release

on:
  workflow_dispatch:
  push:
    tags: ['v*-fec.*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/fec.yml
    secrets: inherit
  macos_local:
    needs: build
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/macos-local.yml
    with:
      core_run_id: ${{ github.run_id }}
      publish: false
  publish:
    needs: [build, macos_local]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-verified.yml
    with:
      core_run_id: ${{ github.run_id }}
      apk_run_id: ${{ github.run_id }}
