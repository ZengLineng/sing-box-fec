name: FECBox Release

on:
  workflow_dispatch:
  push:
    tags: ['v*-fec.*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/fec.yml
    secrets: inherit
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package verified artifacts
        run: |
          python3 -m unittest discover -s release -p '*_test.py'
          python3 release/package_fec.py --artifacts artifacts --output release-assets
      - name: Publish immutable version from this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat release/FEC_VERSION)
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag does not match release/FEC_VERSION' >&2
            exit 1
          fi
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Published releases are immutable; bump FEC_VERSION"'
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "FECBox $version" --draft --prerelease --notes-file release-assets/RELEASE_NOTES.md
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --prerelease=true
